<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gallery Produk</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        linear-gradient(rgba(8, 12, 30, 0.78), rgba(8, 12, 30, 0.9)),
        url("https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=2000&q=80");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
    }

    header {
      text-align: center;
      padding: 45px 20px 30px;
    }

    header h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255,255,255,0.5);
    }

    header p {
      margin-top: 10px;
      color: #d5d9ff;
      font-size: 16px;
    }

    .container {
      width: 92%;
      max-width: 1400px;
      margin: auto;
      padding-bottom: 50px;
    }

    .table-box {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: rgba(0,0,0,0.55);
      padding: 20px;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    td {
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      vertical-align: middle;
    }

    tr:hover {
      background: rgba(255,255,255,0.08);
    }

    .number {
      font-weight: bold;
      font-size: 18px;
    }

    .product-image {
      width: 120px;
      height: 90px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #7CFFB2;
      text-shadow: 0 0 10px rgba(124,255,178,0.3);
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(37,99,235,0.5);
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 28px;
      }

      .table-box {
        overflow-x: auto;
      }

      table {
        min-width: 700px;
      }
    }
  </style>
</head>

<body>
