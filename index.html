      text-align: center;

    }

    header h1 {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: #cbd5e1;
      font-size: 16px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: white;
      outline: none;
      font-size: 15px;
      backdrop-filter: blur(10px);
    }

    .search-box input::placeholder {
      color: #cbd5e1;
    }

    .total {
      padding: 13px 20px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      color: #e2e8f0;
      white-space: nowrap;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 22px;
    }

    .card {
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      transition: 0.3s ease;
    }

    .card:hover {
      transform: translateY(-7px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .image-box {
      height: 220px;
      background: linear-gradient(135deg, #1e293b, #334155);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-placeholder {
      text-align: center;
      padding: 20px;
      color: #cbd5e1;
    }

    .image-placeholder .icon {
      font-size: 45px;
      display: block;
      margin-bottom: 10px;
    }

    .card-content {
      padding: 20px;
    }

    .item-number {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .card h3 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    .price-label {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .price {
      color: #4ade80;
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      padding: 12px 10px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      transition: 0.25s;
    }

    .btn-view {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
    }

    .btn-view:hover {
      transform: scale(1.03);
    }

    .btn-price {
      background: rgba(255,255,255,0.1);

    }

      .container {

      }

    function renderProducts(data) {

      const productList = document.getElementById("productList");

      productList.innerHTML = "";

      data.forEach(product => {

        const card = document.createElement("div");

        card.className = "card";

        let imageContent = "";

        if (product.imageUrl) {

          imageContent = `
            <img
              src="${product.imageUrl}"
              alt="Produk ${product.no}"
              loading="lazy"
            >
          `;

        } else {

          imageContent = `
            <div class="image-placeholder">
              <span class="icon">🖼️</span>
              <div>Gambar Produk ${product.no}</div>
              <small>Klik tombol di bawah untuk melihat gambar</small>
            </div>
          `;

        }

        card.innerHTML = `

          <div class="image-box">
            ${imageContent}
          </div>

          <div class="card-content">

            <div class="item-number">
              ITEM #${product.no}
            </div>

            <h3>
              Produk ${product.no}

            <div class="price-label">

            <div class="price">

            <div class="buttons">

                href="${product.link}"
                target="_blank"
                rel="noopener noreferrer"
              >

              <button
                class="btn btn-price"
                onclick="copyLink('${product.link}')"
              >
                🔗 Salin
              </button>

            </div>

          </div>

        `;

        productList.appendChild(card);

      });

      document.getElementById("totalItems").textContent = data.length;

    function searchProducts() {

      const keyword =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();

      const filtered =
        products.filter(product =>
          String(product.no).includes(keyword)
        );

      renderProducts(filtered);

    }


    function copyLink(link) {

      navigator.clipboard.writeText(link)
        .then(() => {
          alert("Link berhasil disalin!");
        })
        .catch(() => {
          alert("Gagal menyalin link.");
        });

    }
